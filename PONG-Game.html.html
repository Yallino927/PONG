  <!-- Custom Inline SVG Home Screen & Favicon Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230a0a0f'/%3E%3Cline x1='64' y1='256' x2='448' y2='256' stroke='%23ffffff' stroke-opacity='0.22' stroke-width='10' stroke-dasharray='24 24'/%3E%3Crect x='166' y='74' width='180' height='26' rx='13' fill='%23ff006e'/%3E%3Crect x='166' y='412' width='180' height='26' rx='13' fill='%2300f5d4'/%3E%3Ccircle cx='286' cy='210' r='22' fill='%23ffbe0b'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230a0a0f'/%3E%3Cline x1='64' y1='256' x2='448' y2='256' stroke='%23ffffff' stroke-opacity='0.22' stroke-width='10' stroke-dasharray='24 24'/%3E%3Crect x='166' y='74' width='180' height='26' rx='13' fill='%23ff006e'/%3E%3Crect x='166' y='412' width='180' height='26' rx='13' fill='%2300f5d4'/%3E%3Ccircle cx='286' cy='210' r='22' fill='%23ffbe0b'/%3E%3C/svg%3E" />
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22NEON%20PONG%22%2C%22short_name%22%3A%22PONG%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0a0f%22%2C%22theme_color%22%3A%22%230a0a0f%22%2C%22orientation%22%3A%22portrait%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%2520viewBox%3D'0%25200%2520512%2520512'%253E%253Crect%2520width%3D'512'%2520height%3D'512'%2520rx%3D'112'%2520fill%3D'%25230a0a0f'%2F%253E%253Crect%2520x%3D'166'%2520y%3D'74'%2520width%3D'180'%2520height%3D'26'%2520rx%3D'13'%2520fill%3D'%2523ff006e'%2F%253E%253Crect%2520x%3D'166'%2520y%3D'412'%2520width%3D'180'%2520height%3D'26'%2520rx%3D'13'%2520fill%3D'%252300f5d4'%2F%253E%253Ccircle%2520cx%3D'286'%2520cy%3D'210'%2520r%3D'22'%2520fill%3D'%2523ffbe0b'%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D" />

  <style>
    :root {
      --bg: #0a0a0f;
      --cyan: #00f5d4;
      --magenta: #ff006e;
      --amber: #ffbe0b;
      --panel: rgba(16, 16, 26, 0.88);
      --border: rgba(255, 255, 255, 0.14);
      --safe-top: env(safe-area-inset-top, 12px);
      --safe-bottom: env(safe-area-inset-bottom, 12px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      background: var(--bg);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }

    #pongCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Top-right quick controls */
    .top-bar {
      position: fixed;
      top: calc(var(--safe-top) + 10px);
      right: calc(var(--safe-right) + 14px);
      display: flex;
      gap: 10px;
      z-index: 20;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.16);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Modal Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);
      background: rgba(10, 10, 15, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 30;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--cyan), #ffffff 55%, var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.58);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.52);
      margin-bottom: 8px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.36);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 10px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: rgba(0, 245, 212, 0.18);
      color: var(--cyan);
    }

    .btn {
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      border: none;
      font-size: 0.96rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.12s ease;
    }

    .btn:last-child {
      margin-bottom: 0;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-cyan {
      background: linear-gradient(135deg, var(--cyan), #00bbf9);
      color: #061215;
    }

    .btn-pink {
      background: rgba(255, 0, 110, 0.16);
      color: #ff5c9e;
      border: 1px solid rgba(255, 0, 110, 0.42);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
      border: 1px solid var(--border);
    }

    .score-display {
      font-size: 2.7rem;
      font-weight: 900;
      margin: 10px 0 22px;
      letter-spacing: 0.08em;
    }

    .footer-note {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.52);
    }
  </style>
</head>
<body>
  <canvas id="pongCanvas"></canvas>

  <div class="top-bar">
    <button id="muteBtn" class="icon-btn" aria-label="Toggle Sound" title="Sound">
      <svg id="soundOnSvg" viewBox="0 0 24 24">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="soundOffSvg" viewBox="0 0 24 24" style="display:none;">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
    <button id="pauseBtn" class="icon-btn" aria-label="Pause Game" title="Pause" style="display:none;">
      <svg viewBox="0 0 24 24">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
    </button>
  </div>

  <!-- Start Screen -->
  <div id="startScreen" class="overlay">
    <div class="card">
      <div class="title">NEON PONG</div>
      <div class="subtitle">First to 7 Points</div>

      <span class="label">AI Difficulty</span>
      <div class="segmented" id="diffSelector">
        <button class="seg-btn" data-diff="chill">Chill</button>
        <button class="seg-btn active" data-diff="pro">Pro</button>
        <button class="seg-btn" data-diff="insane">Insane</button>
      </div>

      <button id="play1P" class="btn btn-cyan">1 Player vs AI</button>
      <button id="play2P" class="btn btn-pink">2 Players (Touch)</button>

      <div class="footer-note" id="controlsHint">
        Drag or tap to move • Arrow keys / A &amp; D supported
      </div>
    </div>
  </div>

  <!-- Pause Screen -->
  <div id="pauseScreen" class="overlay hidden">
    <div class="card">
      <div class="title" style="font-size:1.9rem;">PAUSED</div>
      <div class="subtitle">Game Suspended</div>
      <button id="resumeBtn" class="btn btn-cyan">Resume</button>
      <button id="menuFromPauseBtn" class="btn btn-ghost">Main Menu</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="overlay hidden">
    <div class="card">
      <div id="resultTitle" class="title" style="font-size:1.9rem;">YOU WIN!</div>
      <div id="resultScore" class="score-display">7 - 3</div>
      <button id="replayBtn" class="btn btn-cyan">Play Again</button>
      <button id="menuFromOverBtn" class="btn btn-ghost">Main Menu</button>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      // =========================================================
      // 1. RETRO SYNTH SOUND EFFECTS (WEB AUDIO API)
      // =========================================================
      const SynthAudio = (() => {
        let ctx = null;
        let muted = false;

        function ensureContext() {
          try {
            if (!ctx) {
              const AudioContextClass = window.AudioContext || window.webkitAudioContext;
              if (AudioContextClass) ctx = new AudioContextClass();
            }
            if (ctx && ctx.state === 'suspended') {
              ctx.resume().catch(() => {});
            }
          } catch (_) {
            // Audio unavailable
          }
        }

        function tone(startFreq, endFreq, type, duration, gainPeak = 0.16) {
          if (muted) return;
          ensureContext();
          if (!ctx) return;

          try {
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(startFreq, now);
            if (endFreq !== null) {
              osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), now + duration);
            }

            gain.gain.setValueAtTime(gainPeak, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + duration);
          } catch (_) {
            // Ignore audio scheduling errors
          }
        }

        return {
          unlock: ensureContext,
          toggleMute() {
            muted = !muted;
            return muted;
          },
          hitPaddle(rallyFactor = 0) {
            const boost = Math.min(rallyFactor, 1) * 180;
            tone(430 + boost, 640 + boost, 'triangle', 0.085, 0.2);
          },
          hitWall() {
            tone(250, 180, 'sine', 0.055, 0.13);
          },
          scorePoint(playerScored) {
            if (playerScored) {
              tone(523.25, null, 'sine', 0.11, 0.17);
              setTimeout(() => tone(659.25, null, 'sine', 0.16, 0.17), 85);
            } else {
              tone(220, 130, 'sawtooth', 0.15, 0.13);
            }
          },
          matchEnd(won) {
            const notes = won ? [523.25, 659.25, 783.99, 1046.5] : [392.0, 349.23, 311.13, 261.63];
            notes.forEach((freq, idx) => {
              setTimeout(() => tone(freq, null, 'triangle', 0.18, 0.18), idx * 105);
            });
          }
        };
      })();

      // =========================================================
      // 2. FULL-SCREEN CANVAS & VIEWPORT RESIZING
      // =========================================================
      const canvas = document.getElementById('pongCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      let viewW = window.innerWidth;
      let viewH = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let safeTop = 16;
      let safeBottom = 16;

      function readSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden;';
        document.body.appendChild(probe);
        const r = probe.getBoundingClientRect();
        safeTop = Math.max(r.top, 14);
        safeBottom = Math.max(window.innerHeight - r.bottom, 14);
        document.body.removeChild(probe);
      }

      const WIN_SCORE = 7;
      const PALETTE = {
        bg: '#0a0a0f',
        p1: '#00f5d4',
        p2: '#ff006e',
        ball: '#ffffff',
        accent: '#ffbe0b'
      };

      const AI_PRESETS = {
        chill: { speedRatio: 0.48, errorPx: 36, baseFactor: 0.56, maxFactor: 1.05 },
        pro: { speedRatio: 0.74, errorPx: 15, baseFactor: 0.68, maxFactor: 1.28 },
        insane: { speedRatio: 0.98, errorPx: 2, baseFactor: 0.78, maxFactor: 1.48 }
      };

      const game = {
        mode: 'MENU', // MENU, PLAYING, PAUSED, GAMEOVER
        players: '1P', // 1P, 2P
        difficulty: 'pro',
        p1Score: 0,
        p2Score: 0,
        serveDelay: 0,
        shake: 0,
        rallies: 0
      };

      const bottomPaddle = {
        x: viewW / 2,
        y: viewH - 54,
        w: 110,
        h: 15,
        targetX: viewW / 2,
        vx: 0,
        flash: 0
      };

      const topPaddle = {
        x: viewW / 2,
        y: 54,
        w: 110,
        h: 15,
        targetX: viewW / 2,
        vx: 0,
        aiBias: 0,
        flash: 0
      };

      const ball = {
        x: viewW / 2,
        y: viewH / 2,
        vx: 0,
        vy: 0,
        r: 9,
        speed: 420,
        trail: []
      };

      let sparks = [];

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function layoutEntities() {
        const pw = clamp(viewW * 0.25, 84, 136);
        const ph = 15;
        const margin = pw / 2 + 8;

        bottomPaddle.w = pw;
        bottomPaddle.h = ph;
        bottomPaddle.y = viewH - safeBottom - 36;
        bottomPaddle.x = clamp(bottomPaddle.x, margin, viewW - margin);
        bottomPaddle.targetX = bottomPaddle.x;

        topPaddle.w = pw;
        topPaddle.h = ph;
        topPaddle.y = safeTop + 36;
        topPaddle.x = clamp(topPaddle.x, margin, viewW - margin);
        topPaddle.targetX = topPaddle.x;

        ball.r = clamp(Math.min(viewW, viewH) * 0.016, 8, 11);
      }

      function handleResize() {
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(viewW * dpr);
        canvas.height = Math.floor(viewH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        readSafeInsets();
        layoutEntities();
      }

      // =========================================================
      // 3. GAMEPLAY & PHYSICS
      // =========================================================
      function emitSparks(x, y, color, count = 14) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 75 + Math.random() * 230;
          sparks.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 1.8 + Math.random() * 1.3,
            r: 2 + Math.random() * 2.8,
            color
          });
        }
      }

      function serveBall(towardBottom = true) {
        ball.x = viewW / 2;
        ball.y = viewH / 2;
        ball.trail = [];
        game.rallies = 0;
        game.serveDelay = 0.65;

        const preset = AI_PRESETS[game.difficulty];
        ball.speed = Math.max(viewH, 560) * preset.baseFactor;

        const angle = Math.random() * 0.6 - 0.3;
        const dirY = towardBottom ? 1 : -1;
        ball.vx = Math.sin(angle) * ball.speed;
        ball.vy = Math.cos(angle) * ball.speed * dirY;

        topPaddle.aiBias = (Math.random() * 2 - 1) * preset.errorPx;
      }

      function startMatch(playerMode) {
        SynthAudio.unlock();
        game.players = playerMode;
        game.p1Score = 0;
        game.p2Score = 0;
        game.mode = 'PLAYING';
        sparks = [];

        layoutEntities();
        bottomPaddle.x = bottomPaddle.targetX = viewW / 2;
        topPaddle.x = topPaddle.targetX = viewW / 2;

        serveBall(Math.random() > 0.5);
        syncUI();
      }

      const keysDown = Object.create(null);

      function stepSimulation(dt) {
        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.life -= s.decay * dt;
          if (s.life <= 0) sparks.splice(i, 1);
        }

        if (game.shake > 0) {
          game.shake = Math.max(0, game.shake - dt * 28);
        }
        bottomPaddle.flash = Math.max(0, bottomPaddle.flash - dt * 3.5);
        topPaddle.flash = Math.max(0, topPaddle.flash - dt * 3.5);

        if (game.mode !== 'PLAYING') return;

        // Keyboard controls (Bottom paddle or P2 arrows in 2P mode)
        const moveRate = viewW * 1.15;
        if (keysDown.KeyA) bottomPaddle.targetX -= moveRate * dt;
        if (keysDown.KeyD) bottomPaddle.targetX += moveRate * dt;

        if (game.players === '2P') {
          if (keysDown.ArrowLeft) topPaddle.targetX -= moveRate * dt;
          if (keysDown.ArrowRight) topPaddle.targetX += moveRate * dt;
        } else {
          if (keysDown.ArrowLeft) bottomPaddle.targetX -= moveRate * dt;
          if (keysDown.ArrowRight) bottomPaddle.targetX += moveRate * dt;
        }

        const halfW = bottomPaddle.w / 2;
        const minX = halfW + 8;
        const maxX = viewW - halfW - 8;

        // Update bottom paddle
        const prevBottomX = bottomPaddle.x;
        bottomPaddle.targetX = clamp(bottomPaddle.targetX, minX, maxX);
        bottomPaddle.x += (bottomPaddle.targetX - bottomPaddle.x) * Math.min(1, dt * 28);
        bottomPaddle.vx = (bottomPaddle.x - prevBottomX) / Math.max(dt, 0.001);

        // Update top paddle (2P touch/keys or AI)
        const prevTopX = topPaddle.x;
        if (game.players === '2P') {
          topPaddle.targetX = clamp(topPaddle.targetX, minX, maxX);
          topPaddle.x += (topPaddle.targetX - topPaddle.x) * Math.min(1, dt * 28);
        } else {
          const preset = AI_PRESETS[game.difficulty];
          const maxAiSpeed = viewW * preset.speedRatio * 1.35;
          const desiredX = ball.vy < 0
            ? clamp(ball.x + topPaddle.aiBias, minX, maxX)
            : clamp(viewW / 2 + topPaddle.aiBias * 0.5, minX, maxX);
          const diff = desiredX - topPaddle.x;
          topPaddle.x += clamp(diff, -maxAiSpeed * dt, maxAiSpeed * dt);
        }
        topPaddle.vx = (topPaddle.x - prevTopX) / Math.max(dt, 0.001);

        if (game.serveDelay > 0) {
          game.serveDelay -= dt;
          return;
        }

        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 10) ball.trail.shift();

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Side wall bounces
        if (ball.x - ball.r <= 0) {
          ball.x = ball.r;
          ball.vx = Math.abs(ball.vx);
          SynthAudio.hitWall();
          emitSparks(ball.x, ball.y, PALETTE.accent, 7);
        } else if (ball.x + ball.r >= viewW) {
          ball.x = viewW - ball.r;
          ball.vx = -Math.abs(ball.vx);
          SynthAudio.hitWall();
          emitSparks(ball.x, ball.y, PALETTE.accent, 7);
        }

        // Bottom paddle bounce
        const bTop = bottomPaddle.y - bottomPaddle.h / 2;
        const bBot = bottomPaddle.y + bottomPaddle.h / 2;
        if (
          ball.vy > 0 &&
          ball.y + ball.r >= bTop &&
          ball.y - ball.r <= bBot &&
          Math.abs(ball.x - bottomPaddle.x) <= bottomPaddle.w / 2 + ball.r
        ) {
          bounceOnPaddle(bottomPaddle, -1, PALETTE.p1);
        }

        // Top paddle bounce
        const tTop = topPaddle.y - topPaddle.h / 2;
        const tBot = topPaddle.y + topPaddle.h / 2;
        if (
          ball.vy < 0 &&
          ball.y - ball.r <= tBot &&
          ball.y + ball.r >= tTop &&
          Math.abs(ball.x - topPaddle.x) <= topPaddle.w / 2 + ball.r
        ) {
          bounceOnPaddle(topPaddle, 1, PALETTE.p2);
        }

        // Goal checks
        if (ball.y - ball.r > viewH) {
          game.p2Score++;
          game.shake = 10;
          SynthAudio.scorePoint(false);
          emitSparks(ball.x, viewH - 12, PALETTE.p2, 22);
          afterScore(false);
        } else if (ball.y + ball.r < 0) {
          game.p1Score++;
          game.shake = 10;
          SynthAudio.scorePoint(true);
          emitSparks(ball.x, 12, PALETTE.p1, 22);
          afterScore(true);
        }
      }

      function bounceOnPaddle(paddle, dirY, color) {
        game.rallies++;
        paddle.flash = 1;
        ball.y = paddle.y + dirY * (paddle.h / 2 + ball.r + 1);

        const offset = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
        const preset = AI_PRESETS[game.difficulty];
        const maxSpeed = Math.max(viewH, 560) * preset.maxFactor;
        ball.speed = Math.min(maxSpeed, ball.speed * 1.045 + 10);

        const angle = offset * (Math.PI * 0.34);
        ball.vx = Math.sin(angle) * ball.speed + paddle.vx * 0.14;
        ball.vy = Math.cos(angle) * ball.speed * dirY;

        const norm = Math.hypot(ball.vx, ball.vy) || 1;
        ball.vx = (ball.vx / norm) * ball.speed;
        ball.vy = (ball.vy / norm) * ball.speed;

        topPaddle.aiBias = (Math.random() * 2 - 1) * preset.errorPx;
        game.shake = 4;
        SynthAudio.hitPaddle(game.rallies / 12);
        emitSparks(ball.x, ball.y, color, 14);
      }

      function afterScore(p1Scored) {
        if (game.p1Score >= WIN_SCORE || game.p2Score >= WIN_SCORE) {
          game.mode = 'GAMEOVER';
          const p1Won = game.p1Score >= WIN_SCORE;
          SynthAudio.matchEnd(p1Won);
          showEndModal(p1Won);
        } else {
          serveBall(p1Scored);
        }
      }

      // =========================================================
      // 4. CANVAS RENDERING
      // =========================================================
      function fillPill(cx, cy, w, h) {
        ctx.beginPath();
        ctx.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2);
        ctx.fill();
      }

      function drawFrame() {
        ctx.save();

        if (game.shake > 0.2) {
          ctx.translate(
            (Math.random() * 2 - 1) * game.shake,
            (Math.random() * 2 - 1) * game.shake
          );
        }

        ctx.fillStyle = PALETTE.bg;
        ctx.fillRect(-20, -20, viewW + 40, viewH + 40);

        // Court divider & center ring
        const midY = viewH / 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(16, midY);
        ctx.lineTo(viewW - 16, midY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(viewW / 2, midY, Math.min(viewW, viewH) * 0.11, 0, Math.PI * 2);
        ctx.stroke();

        // Background scores
        const scoreSize = Math.min(viewW * 0.28, 128);
        ctx.font = `900 ${scoreSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.save();
        ctx.translate(viewW / 2, midY - scoreSize * 0.82);
        if (game.players === '2P') ctx.rotate(Math.PI);
        ctx.fillStyle = 'rgba(255, 0, 110, 0.13)';
        ctx.fillText(String(game.p2Score), 0, 0);
        ctx.restore();

        ctx.fillStyle = 'rgba(0, 245, 212, 0.13)';
        ctx.fillText(String(game.p1Score), viewW / 2, midY + scoreSize * 0.85);

        // Sparks
        for (let i = 0; i < sparks.length; i++) {
          const s = sparks[i];
          ctx.globalAlpha = Math.max(0, s.life);
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Top paddle
        ctx.shadowColor = PALETTE.p2;
        ctx.shadowBlur = 16 + topPaddle.flash * 18;
        ctx.fillStyle = PALETTE.p2;
        fillPill(topPaddle.x, topPaddle.y, topPaddle.w, topPaddle.h);

        // Bottom paddle
        ctx.shadowColor = PALETTE.p1;
        ctx.shadowBlur = 16 + bottomPaddle.flash * 18;
        ctx.fillStyle = PALETTE.p1;
        fillPill(bottomPaddle.x, bottomPaddle.y, bottomPaddle.w, bottomPaddle.h);

        // Ball trail
        ctx.shadowBlur = 0;
        for (let i = 0; i < ball.trail.length; i++) {
          const t = ball.trail[i];
          const ratio = (i + 1) / ball.trail.length;
          ctx.fillStyle = `rgba(255, 190, 11, ${ratio * 0.28})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, ball.r * (0.45 + ratio * 0.45), 0, Math.PI * 2);
          ctx.fill();
        }

        // Ball
        ctx.shadowColor = PALETTE.accent;
        ctx.shadowBlur = 18;
        ctx.fillStyle = PALETTE.ball;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.restore();
      }

      // =========================================================
      // 5. TOUCH, POINTER & KEYBOARD INPUT
      // =========================================================
      const touchesById = new Map();

      canvas.addEventListener('touchstart', (e) => {
        if (game.mode !== 'PLAYING') return;
        SynthAudio.unlock();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          const zone = game.players === '2P' && t.clientY < viewH / 2 ? 'top' : 'bottom';
          touchesById.set(t.identifier, { zone, lastX: t.clientX });

          if (zone === 'top') topPaddle.targetX = t.clientX;
          else bottomPaddle.targetX = t.clientX;
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (game.mode !== 'PLAYING') return;
        e.preventDefault();

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          const entry = touchesById.get(t.identifier);
          if (!entry) continue;

          const dx = t.clientX - entry.lastX;
          entry.lastX = t.clientX;

          if (entry.zone === 'top') topPaddle.targetX += dx * 1.15;
          else bottomPaddle.targetX += dx * 1.15;
        }
      }, { passive: false });

      const clearTouch = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          touchesById.delete(e.changedTouches[i].identifier);
        }
      };
      canvas.addEventListener('touchend', clearTouch, { passive: true });
      canvas.addEventListener('touchcancel', clearTouch, { passive: true });

      let mouseActive = false;
      canvas.addEventListener('mousedown', (e) => {
        if (game.mode !== 'PLAYING') return;
        SynthAudio.unlock();
        mouseActive = true;
        bottomPaddle.targetX = e.clientX;
      });
      window.addEventListener('mousemove', (e) => {
        if (game.mode === 'PLAYING' && (mouseActive || e.buttons === 1)) {
          bottomPaddle.targetX = e.clientX;
        }
      });
      window.addEventListener('mouseup', () => {
        mouseActive = false;
      });

      window.addEventListener('keydown', (e) => {
        keysDown[e.code] = true;
        if (e.code === 'Escape' || e.code === 'KeyP') {
          if (game.mode === 'PLAYING') setPaused(true);
          else if (game.mode === 'PAUSED') setPaused(false);
        }
      });
      window.addEventListener('keyup', (e) => {
        keysDown[e.code] = false;
      });

      // =========================================================
      // 6. UI CONTROLS & LOOP
      // =========================================================
      const startScreen = document.getElementById('startScreen');
      const pauseScreen = document.getElementById('pauseScreen');
      const gameOverScreen = document.getElementById('gameOverScreen');
      const pauseBtn = document.getElementById('pauseBtn');
      const muteBtn = document.getElementById('muteBtn');
      const soundOnSvg = document.getElementById('soundOnSvg');
      const soundOffSvg = document.getElementById('soundOffSvg');

      function syncUI() {
        startScreen.classList.toggle('hidden', game.mode !== 'MENU');
        pauseScreen.classList.toggle('hidden', game.mode !== 'PAUSED');
        gameOverScreen.classList.toggle('hidden', game.mode !== 'GAMEOVER');
        pauseBtn.style.display = game.mode === 'PLAYING' ? 'inline-flex' : 'none';
      }

      function setPaused(paused) {
        if (paused && game.mode === 'PLAYING') {
          game.mode = 'PAUSED';
        } else if (!paused && game.mode === 'PAUSED') {
          game.mode = 'PLAYING';
          lastFrameTime = performance.now();
        }
        syncUI();
      }

      function showEndModal(p1Won) {
        const titleEl = document.getElementById('resultTitle');
        const scoreEl = document.getElementById('resultScore');

        if (game.players === '2P') {
          titleEl.textContent = p1Won ? 'BOTTOM WINS!' : 'TOP WINS!';
        } else {
          titleEl.textContent = p1Won ? 'YOU WIN!' : 'AI WINS!';
        }
        scoreEl.textContent = `${game.p1Score} - ${game.p2Score}`;
        syncUI();
      }

      document.getElementById('diffSelector').addEventListener('click', (e) => {
        const btn = e.target.closest('.seg-btn');
        if (!btn) return;
        SynthAudio.unlock();
        SynthAudio.hitWall();
        document.querySelectorAll('#diffSelector .seg-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        game.difficulty = btn.dataset.diff;
      });

      document.getElementById('play1P').addEventListener('click', () => startMatch('1P'));
      document.getElementById('play2P').addEventListener('click', () => startMatch('2P'));

      muteBtn.addEventListener('click', () => {
        const isMuted = SynthAudio.toggleMute();
        soundOnSvg.style.display = isMuted ? 'none' : 'block';
        soundOffSvg.style.display = isMuted ? 'block' : 'none';
        if (!isMuted) SynthAudio.hitWall();
      });

      pauseBtn.addEventListener('click', () => setPaused(true));
      document.getElementById('resumeBtn').addEventListener('click', () => setPaused(false));
      document.getElementById('replayBtn').addEventListener('click', () => startMatch(game.players));

      const goMenu = () => {
        game.mode = 'MENU';
        syncUI();
      };
      document.getElementById('menuFromPauseBtn').addEventListener('click', goMenu);
      document.getElementById('menuFromOverBtn').addEventListener('click', goMenu);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && game.mode === 'PLAYING') {
          setPaused(true);
        }
      });

      let lastFrameTime = performance.now();

      function tick(now) {
        const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
        lastFrameTime = now;

        stepSimulation(dt);
        drawFrame();

        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', handleResize);
      window.addEventListener('orientationchange', () => setTimeout(handleResize, 120));

      window.onload = () => {
        handleResize();
        lastFrameTime = performance.now();
        requestAnimationFrame(tick);
      };
    })();
  </script>
</body>
</html>
